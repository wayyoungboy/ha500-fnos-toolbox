name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FNPACK_URL: https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
  FNPACK_SHA256: 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: bash -n package/ha500-toolbox/cmd/* scripts/build.sh
      - run: chmod +x package/ha500-toolbox/cmd/* scripts/build.sh scripts/validate_package.py
      - name: Download verified fnpack
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            "${FNPACK_URL}" --output "${RUNNER_TEMP}/fnpack"
          echo "${FNPACK_SHA256}  ${RUNNER_TEMP}/fnpack" | sha256sum --check --strict
          chmod 755 "${RUNNER_TEMP}/fnpack"
      - name: Build FPK
        env:
          FNPACK: ${{ runner.temp }}/fnpack
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ha500-toolbox-fpk
          path: dist/*.fpk
          if-no-files-found: error

